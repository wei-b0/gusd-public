services:
  postgres:
    image: postgres:16-alpine
    container_name: gusd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gusd
      POSTGRES_PASSWORD: gusd
      POSTGRES_DB: gusd
    ports:
      - "54329:5432"
    volumes:
      - gusd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gusd -d gusd"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gusd-internal

  # Protocol indexer (Envio HyperIndex). Writes only its dedicated schema in
  # the same Postgres; its health and metrics surface stays private.
  indexer:
    build:
      context: ..
      dockerfile: apps/indexer/Dockerfile
    image: gusd-indexer:local
    container_name: gusd-indexer
    restart: unless-stopped
    environment:
      ENVIO_PG_HOST: postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: gusd
      ENVIO_PG_PASSWORD: gusd
      ENVIO_PG_DATABASE: gusd
      ENVIO_PG_SCHEMA: ${INDEXER_SCHEMA:-gusd_index_envio_docker_v2}
      ENVIO_PG_SSL_MODE: "false"
      ENVIO_HASURA: "false"
      ENVIO_INDEXER_PORT: 9898
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      INDEXER_CHAIN_ID: ${INDEXER_CHAIN_ID:-31337}
      INDEXER_RPC_URL: ${INDEXER_RPC_URL:-http://host.docker.internal:8545}
      INDEXER_DEPLOYMENTS_DIR: /repo/apps/contracts/deployments
      LOG_LEVEL: ${INDEXER_LOG_LEVEL:-info}
    volumes:
      # The deployment record is baked into the image as a build-time
      # fallback, but redeploys rewrite it on the host — mount it read-only
      # so `docker compose restart indexer` picks up fresh addresses without
      # an image rebuild (addressed at boot from this file; see
      # apps/indexer/src/addresses.ts).
      - ../apps/contracts/deployments:/repo/apps/contracts/deployments:ro
    extra_hosts:
      # Linux parity for the host.docker.internal RPC default (Docker Desktop
      # provides it natively on macOS).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9898/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - gusd-internal

  # One-shot drizzle migration runner (packages/db), reusing the oracle
  # image — it already ships @gusd/db built with its drizzle/ journal.
  # Drizzle migrations are journaled, so re-running on every `up` is a no-op
  # once current; a fresh volume gets public.* before anything reads it.
  # Also covers the host `pnpm db:migrate` path — same DB, same journal.
  db-migrate:
    build:
      context: ..
      dockerfile: apps/oracle/Dockerfile
    image: gusd-oracle:local
    container_name: gusd-db-migrate
    command: ["node", "/repo/packages/db/dist/cli.js", "migrate"]
    environment:
      DATABASE_URL: postgres://gusd:gusd@postgres:5432/gusd
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - gusd-internal

  # Oracle — the price API (Fastify) the web dev server consumes on
  # ${ORACLE_PORT:-8080} (the web default base is http://127.0.0.1:8080 —
  # stop a host-run `pnpm dev:oracle` or remap if they collide). Collectors
  # scrape provider APIs outbound; the indexer wiring mirrors host dev:
  # INDEXER_SCHEMA is the Envio entity schema and INDEXER_INTERNAL_URL reaches
  # Envio's private metrics surface inside this network. /v1/health stays 200
  # while Envio backfills (the
  # indexer subsection degrades, never flips unhealthy), so this healthcheck
  # never fights a long backfill.
  # Env pass-through is intentionally minimal: only `||`-tolerant vars are
  # forwarded (empty → code default). The `??`-defaulted knobs (LOG_LEVEL,
  # ORACLE_* regions, replay) must stay unset to keep their defaults from
  # apps/oracle/src/env.ts — an empty string would defeat `??`.
  oracle:
    build:
      context: ..
      dockerfile: apps/oracle/Dockerfile
    image: gusd-oracle:local
    container_name: gusd-oracle
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gusd:gusd@postgres:5432/gusd
      # The code default binds 127.0.0.1 — loopback inside the container
      # only. The published port and healthcheck need all interfaces.
      HOST: 0.0.0.0
      PORT: 8080
      HYPERBOLIC_API_KEY: ${HYPERBOLIC_API_KEY:-}
      PRIMEINTELLECT_API_KEY: ${PRIMEINTELLECT_API_KEY:-}
      INDEXER_SCHEMA: ${INDEXER_SCHEMA:-gusd_index_envio_docker_v2}
      INDEXER_INTERNAL_URL: http://indexer:9898
      INDEXER_STATUS_RPC_URL: ${INDEXER_STATUS_RPC_URL:-http://host.docker.internal:8545}
      INDEXER_CHAIN_ID: ${INDEXER_CHAIN_ID:-31337}
    ports:
      - "${ORACLE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      # started, NOT healthy: Envio exits when the chain RPC is unreachable
      # (e.g. no local Anvil), and the oracle's indexer wiring degrades by
      # design (unreachable Envio → "degraded", never unhealthy). Gating on
      # liveness would hold the whole oracle hostage to a chain that may not
      # be running.
      indexer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - gusd-internal

  # Attestor — the pull-oracle signing loop, a default stack member. It
  # reads candidates, audits them, EIP-712-signs one report per (gpu, epoch),
  # and persists it to the `reports` table the oracle API serves. It NEVER
  # broadcasts — no RPC exists in its environment. The defaults mirror
  # Deploy.s.sol's local posture (ORACLE_ATTESTOR unset at deploy ⇒ the
  # attestor IS the deployer): anvil account #0's key — a PUBLIC dev key,
  # the record's oracleAttestor — and chain id 31337. The oracle address is
  # NOT defaulted here: pnpm stack:up injects it from
  # apps/contracts/deployments/<id>.json at `up` time, so a redeploy plus a
  # plain `pnpm stack:up` re-syncs it (never bake a stale address into the
  # file) — it is the EIP-712 domain's verifyingContract. For a remote
  # chain, override the block in infra/.env; a key mismatch with the
  # deployed oracleAttestor makes every signature un-consumable. No
  # healthcheck: the poller has no HTTP surface — restart: unless-stopped
  # covers crash-restart, and attestation outcomes are visible in the DB.
  attestor:
    build:
      context: ..
      dockerfile: apps/attestor/Dockerfile
    image: gusd-attestor:local
    container_name: gusd-attestor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gusd:gusd@postgres:5432/gusd
      ATTESTOR_ORACLE_URL: http://oracle:8080
      # Anvil account #0 — a public dev key, valid ONLY on the local test
      # posture. Never a live-chain attestor key.
      ATTESTOR_PRIVATE_KEY: ${ATTESTOR_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      # Injected by pnpm stack:up from apps/contracts/deployments/<id>.json.
      # Empty (no record yet) is a loud boot error, never a silent skip.
      ATTESTOR_ORACLE_ADDRESS: ${ATTESTOR_ORACLE_ADDRESS:-}
      ATTESTOR_CHAIN_ID: ${ATTESTOR_CHAIN_ID:-31337}
      # Optional read-only RPC for the boot-time posture cross-check (key,
      # chain id, epoch grid vs the DEPLOYED GpuOracle — oracle-check.ts).
      # Never broadcasts; unset on the dev posture means the check only warns.
      ATTESTOR_RPC_URL: ${ATTESTOR_RPC_URL:-}
      # Tunables documented in infra/.env.example. "" falls back to the code
      # default in the attestor's env parser, so an unset var in .env is
      # never a wrong value. Epoch length and the observation floor must
      # match the deployed GpuOracle's constructor values.
      ATTESTOR_EPOCH_LENGTH: ${ATTESTOR_EPOCH_LENGTH:-}
      ATTESTOR_MAX_OBSERVATION_AGE: ${ATTESTOR_MAX_OBSERVATION_AGE:-}
    depends_on:
      oracle:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - gusd-internal

  # Keeper — the perp executor and the ONLY backend service that broadcasts:
  # the oracle candidate stream → offline evaluation against the indexer's
  # perp entities → one attestation fetch (only when work exists) → one sim →
  # one broadcast from a funded hot EOA. Defaults mirror the attestor's local
  # posture: anvil account #1's key — a PUBLIC dev key, funded by the dev
  # chain, never a live-chain key. The engine address comes from the mounted
  # deployment record at boot, so `docker compose restart keeper` re-targets
  # a redeploy without an image rebuild. No healthcheck: no HTTP surface —
  # restart: unless-stopped covers crash-restart, and the hot key's gas floor
  # is alarmed in the keeper's own logs (health.ts).
  keeper:
    build:
      context: ..
      dockerfile: apps/keeper/Dockerfile
    image: gusd-keeper:local
    container_name: gusd-keeper
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gusd:gusd@postgres:5432/gusd
      INDEXER_SCHEMA: ${INDEXER_SCHEMA:-gusd_index_envio_docker_v2}
      KEEPER_RPC_URL: ${KEEPER_RPC_URL:-http://host.docker.internal:8545}
      KEEPER_CHAIN_ID: ${KEEPER_CHAIN_ID:-31337}
      # Anvil account #1 — a public dev key, valid ONLY on the local test
      # posture. Never a live-chain keeper key.
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d}
      ORACLE_HTTP_URL: http://oracle:8080
      ORACLE_WS_URL: ws://oracle:8080/v1/stream
      KEEPER_DEPLOYMENTS_DIR: /repo/apps/contracts/deployments
    volumes:
      - ../apps/contracts/deployments:/repo/apps/contracts/deployments:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      oracle:
        condition: service_healthy
      # started, NOT healthy — same reasoning as the oracle's dependency.
      indexer:
        condition: service_started
    networks:
      - gusd-internal

volumes:
  gusd-postgres-data:

networks:
  gusd-internal:
    driver: bridge
